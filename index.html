<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Retrouvez le site d’anniversaire et le portfolio de Peniel.">
    <title>Peniel — Mes sites</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #10131d; color: #f5f3ef; font-family: system-ui, sans-serif; }
        main { width: min(100%, 42rem); }
        h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); margin: 0 0 .75rem; }
        p { color: #b6b7c2; line-height: 1.6; }
        nav { display: grid; gap: 1rem; margin-top: 2rem; }
        a { display: block; padding: 1.25rem 1.5rem; border: 1px solid #484b59; border-radius: 1rem; color: inherit; text-decoration: none; font-size: 1.15rem; }
        a:hover, a:focus-visible { border-color: #b8a5ff; background: #1b1d2b; }
    </style>
</head>
<body>
    <main>
        <h1>Mes sites</h1>
        <p>Choisissez le site que vous souhaitez visiter.</p>
        <nav aria-label="Mes sites">
            <a href="/anniversaire/">🎉 Site d’anniversaire</a>
            <a href="/portfolio/">Portfolio</a>
        </nav>
    </main>
</body>
</html>
